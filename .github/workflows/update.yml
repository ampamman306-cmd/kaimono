name: life-flyer
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ファイルを確認
        run: ls -la
      - run: pip install pillow
      - name: チラシを読み取る
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が未設定です（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          p=$(find . -name "fetch_life*.py" -not -path "./.git/*" | head -1)
          if [ -z "$p" ]; then
            echo "::error::fetch_life.py が見つかりません。上のファイル一覧を確認してください。"
            exit 1
          fi
          d=$(dirname "$p")
          echo "スクリプト: $p"
          cd "$d" && python fetch_life.py
          mkdir -p "$GITHUB_WORKSPACE/data"
          cp -f "$GITHUB_WORKSPACE/$d"/data/*.json "$GITHUB_WORKSPACE/data/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE" && rm -rf "$d/data"
          ls -la data
      - name: 結果を保存
        run: |
          git config user.name "kaimono-bot"
          git config user.email "kaimono-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update"
          git push
