name: ライフのチラシを読み取る
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python fetch_life.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: save
        run: |
          git config user.name "kaimono-bot"
          git config user.email "kaimono-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "update"
          git push
